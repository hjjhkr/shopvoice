    exclude_title: ['(?:paper|tissue) (?:holder|stand|storage|organizer|caddy)', 'spray', 'wipes', 'flushable (?:wipes|wet)', 'pocket', 'facial', 'travel size', 'gag gift', 'prank', 'novelty']
