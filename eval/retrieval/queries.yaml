  - {id: ki_media_room, type: known_item, query: Hape dollhouse media room furniture, targets: [amz20-2b63cd8ac235]}
  - {id: ki_solitaire_chess, type: known_item, query: ThinkFun solitaire chess, targets: [amz20-7ec4474b6158]}
  - {id: ki_prism_bora, type: known_item, query: Prism Bora parafoil kite, targets: [amz20-e2baa87b9a39, amz20-b6396a48f994]}
  - {id: ki_dog_man, type: known_item, query: Dog Man attack of the fleas board game, targets: [amz20-4e2063a5d109]}
  - {id: ki_dream_kitchen, type: known_item, query: Step2 dream kitchen, targets: [amz20-06e8480f75c0]}

  # ---------------------------------------------------------------- no match
  - {id: nm_steel_cleaner, type: no_match, query: eco-friendly stainless steel cleaner}
  - {id: nm_laptop, type: no_match, query: laptop for college work}
  - {id: nm_espresso, type: no_match, query: espresso machine for my kitchen}
  - {id: nm_lawn_mower, type: no_match, query: gas lawn mower for my yard}
  - {id: nm_earbuds, type: no_match, query: noise cancelling wireless earbuds}
  - {id: nm_dog_food, type: no_match, query: dry dog food for a large dog}
  - {id: nm_printer_ink, type: no_match, query: printer ink cartridges}
  - {id: nm_running_shoes, type: no_match, query: men's running shoes size 10}
  - {id: nm_vitamins, type: no_match, query: multivitamin supplements for adults}
  - {id: nm_car_tires, type: no_match, query: winter tires for my car}

  # ------------------------------------------------ known item, described without its name (semantic recall)
  # The user remembers what the product is or does, not what it is called. Descriptions come from the product's
  # own feature text, so the right answer is unambiguous, but the query shares few words with the title.
  - {id: kd_tsuro, type: known_item, descriptive: true, targets: [amz20-ee0873676d88],
     query: strategy board game where you lay tiles to build paths and try to stay on the board}
  - {id: kd_pusheenicorn, type: known_item, descriptive: true, targets: [amz20-d92c10e1df81],
     query: purple plush cat with a unicorn horn that makes a sound when you squeeze it}
  - {id: kd_physics_pro, type: known_item, descriptive: true, targets: [amz20-2a3b2924f338],
     query: advanced physics kit where you build a wind tunnel and a hydraulic lift}
  - {id: kd_solitaire_chess, type: known_item, descriptive: true, targets: [amz20-7ec4474b6158],
     query: a chess puzzle game you can play alone}
  - {id: kd_dog_man, type: known_item, descriptive: true, targets: [amz20-4e2063a5d109],
     query: cooperative board game based on the Dav Pilkey books where you stop the fleas}
  - {id: kd_retro_kitchen, type: known_item, descriptive: true, targets: [amz20-44d89a4bf8c5],
     query: pink wooden play kitchen with a fridge and a dishwasher whose doors open}
  - {id: kd_super_soaker, type: known_item, descriptive: true, targets: [amz20-afedde0dbe30],
