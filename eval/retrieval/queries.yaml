        - {title: ['dishwasher (?:detergent|pods|pacs|tabs|tablets|packs)', 'dishwashing tablets', 'auto(?:matic)? dish(?:washer)? (?:detergent|pods|powder)']}
    exclude_title: ['^(?!.*(?:detergent|pods?\b|tabs\b|tablets|pacs\b)).*(?:cleaner|rinse aid|rinse agent)', 'dishwasher magic', 'booster', 'additive', 'freshener', '\bsalt\b', 'laundry']
