# Retrieval benchmark for rag.search (ProductStore.search). Used by eval/run_retrieval_eval.py.
# Catalog: Amazon Reviews 2023, Household Supplies (data/processed/products.parquet, 25,000 products: cleaning tools
# and cleaners, laundry, batteries, lighters, paper & plastic, tissues, air fresheners, dishwashing, pest control).
#
# Relevance is NOT taken from any retriever's output, so no method is graded on its own picks.
#   known_item : the user names one product; `targets` are its doc_ids (found with a title search, checked by hand).
#                A product sold in several pack sizes or bundles is one product, so every listing of it is a target.
#                Queries are phrased the way a user would say them ("Bar Keepers Friend powder", no sizes or
#                model numbers), not copied from the title.
#   attribute  : relevance is a rule over catalog fields, written before any retrieval was run:
#                  relevant : grade 1 = the kind of product asked for. Every key must match (AND);
#                             the patterns inside one key are alternatives (OR).
#                             `any` is an OR of sub-criteria (e.g. category OR title), `all` an AND of sub-criteria
#                             (two separate title conditions).
#                  ideal    : grade 2 = also meets the softer preferences (eco-friendly, for the bathroom, heavy duty).
#                             An attribute the user states as the point of the request (fragrance free, 13 gallon,
#                             wool) is part of `relevant`, not `ideal`.
#                  exclude_title / exclude_category : never relevant (holders, refills, tools, accessories, parts).
#                Pattern keys: title (title), text (title + features + description), category (category path).
#                age_max: manufacturer minimum age <= N years (toy catalogs only; unused here).
#                `filters` are passed to rag.search exactly as the Planner would, and relevance also respects them.
#   no_match   : nothing in the catalog fits (verified by title and category search). Most share words with real
#                products (robot vacuum -> robot mop pads, lawn mower -> lawn mower batteries, earbuds -> headphone
#                batteries, shampoo -> carpet shampoo, running shoes -> shoe deodorizer), so a `strong` label in the
#                top 5 counts as a false match.
#
# The criteria were checked by listing every matching product and reading a sample of titles, then audited
# against every product any mode placed in its top 5 (eval/run_retrieval_eval.py --audit). The audit found 11
# relevant products the first criteria graded 0 (e.g. Clorox wipes whose title omits "disinfecting", an oven cleaning
# paste, "Plasticless" paper straws, toilet paper "with flushable tube"). Other fixes made while checking: tools and
# holders that share the product noun (toilet brushes and pumice stones for "toilet bowl cleaner", paper towel
# holders, chainmail scrubbers "for stainless steel"), words inside other words ("versatile" contains "tile"),
# and bundles that contain the product. The fixed criteria apply to every mode equally.

queries:
  # ---------------------------------------------------------------- attribute
  - id: stainless_steel_cleaner
    type: attribute
    query: eco-friendly stainless steel cleaner
    filters: {max_price: 15}
    relevant:
      any:
        - {category: ['Stainless Steel Surface Cleaners']}
        - {title: ['stainless(?: steel)?\b.{0,40}(?:cleaner|cleanser|polish\b|cleaning (?:spray|paste|wipes)|wipes)', '(?:cleaner|polish\b).{0,40}stainless']}
    exclude_title: ['scrubb?er', 'scour', 'sponge', '\bwool\b', 'straws?\b', 'brush', 'tumbler', 'duster', '\bpole\b', 'chainmail', 'cast iron', 'bottle cleaner', '^(?!.*(?:cleaner|cleanser|polish\b|spray)).*\bcloths?\b']
    ideal: {text: ['eco[- ]?friendly', 'plant[- ]based', 'non[- ]toxic', 'biodegradable', 'natural']}

  - id: ff_laundry_detergent
    type: attribute
    query: fragrance free laundry detergent
    relevant:
      any:
        - {category: ['Laundry Detergent']}
        - {title: ['laundry detergent']}
      text: ['fragrance[- ]free', 'unscented', 'free (?:&|and) (?:clear|gentle)', 'no (?:added )?fragrance', 'without fragrance']

  - id: dish_soap_under_5
    type: attribute
    query: dish soap
    filters: {max_price: 5}
    relevant:
      any:
        - {category: ['Dishwashing > Dish Soap']}
        - {title: ['dish(?:washing)? (?:soap|liquid|detergent|spray)', 'dish (?:&|and) (?:hand|bottle) soap']}
    exclude_title: ['dishwasher', 'dispens', 'brush', 'sponge', 'scrubber', 'automatic']

  - id: toilet_bowl_cleaner
    type: attribute
    query: toilet bowl cleaner
    relevant:
      any:
        - {category: ['Toilet Cleaners']}
        - {title: ['toilet (?:bowl )?(?:cleaner|cleaning (?:gel|tablets|stamps)|tablets|gel)']}
    exclude_title: ['brush', 'wand', 'plunger', 'caddy', 'holder', 'toilet paper', 'flushable', 'pumice', 'carpet', '\btool\b']

  - id: microfiber_cloths
    type: attribute
    query: microfiber cleaning cloths
    relevant:
      all: [{title: ['micro[- ]?fib(?:er|re)']}, {title: ['\bcloths?\b', 'towels?\b', '\brags?\b', 'dishcloths?']}]
    exclude_title: ['\bmop\b', 'duster', 'glove', 'mitt', 'slipper', 'sleeve', '\bpads?\b', 'refill', 'sponge', 'brush', 'cleaner and polish', 'conditioner', 'polish\b', 'spray', 'squeegee', 'flints?\b', 'batter']

  - id: disinfecting_wipes
    type: attribute
    query: disinfecting wipes
    relevant:
      any:
        - {category: ['Disinfectant Wipes']}
        - {all: [{title: ['disinfect', 'antibacterial', 'sanitiz', 'kills 99', 'germs?\b']}, {title: ['\bwipes?\b']}]}
    exclude_title: ['dispenser', 'bucket', '\bmop\b', 'flushable', '\bbody\b', 'hand sanitiz', 'baby wipes', 'spray(?! (?:and|&) wipes)']

  - id: kitchen_trash_bags
    type: attribute
    query: 13 gallon kitchen trash bags
    relevant:
      all: [{title: ['trash bags?', 'garbage bags?', 'trash can liners?', 'can liners?', 'bin liners?', 'kitchen bags?']}, {title: ['13[- ]?gal', '13 gallon', 'tall kitchen']}]

  - id: aa_batteries
    type: attribute
    query: AA batteries
    filters: {min_rating: 4.5}
    relevant:
      any:
        - {category: ['Household Batteries > AA$']}
        - {title: ['\bAA\b.{0,40}batter', 'double a batter']}
    exclude_title: ['charger', '\bcase\b', 'organizer', 'storage', 'holder', 'tester', '2/3 ?aa', 'adapter', 'adaptor', 'spacer']

  - id: bathroom_air_freshener
    type: attribute
    query: air freshener for the bathroom
    relevant:
      any:
        - {category: ['Air Fresheners']}
        - {title: ['air freshener', 'odor eliminator', 'room spray', 'toilet spray', 'poo[- ]?pourri']}
    exclude_title: ['car air freshener', 'vent clip', 'shoe']
    ideal: {text: ['bathroom', 'toilet', '\bpoop?\b', 'restroom', 'washroom']}

  - id: ant_killer
    type: attribute
    query: ant killer
    relevant:
      text: ['\bants?\b']
      title: ['\bants?\b', 'multi[- ]insect', 'insect (?:killer|spray)', 'bug (?:killer|spray)', 'pest (?:killer|control spray)', 'insecticide', 'home defense']
    exclude_title: ['ultrasonic', 'plug[- ]in', 'disinfect', 'cast iron', 'kills 99', 'germ', 'virus', 'bacteria', 'mold', 'pouches', 'rodent', 'mice', 'mouse', 'fly trap', 'fruit fl', 'window decal', 'bed bug (?:&|and) mite', 'bed bug (?:killer|spray)', 'moth', '\blice\b', 'mosquito repellent', 'refillable spray bottle', 'empty', 'bulb duster']

  - id: non_scratch_sponge
    type: attribute
