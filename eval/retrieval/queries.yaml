    relevant:
      title: ['lint roll', 'sticky roll', 'lint brush', 'lint remover', 'lint roller', 'pet hair roller', 'fur roller']
    exclude_title: ['shaver', 'defuzzer', 'fuzz remover', 'pill', 'electric', 'rechargeable', 'battery', 'laundry', 'dryer', 'washing machine', 'mesh bag', 'filter', 'broom', 'rake', 'squeegee', 'vent', 'blades?\b']
