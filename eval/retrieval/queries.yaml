      title: ['cr ?2032', 'dl ?2032', '\b2032\b']
    exclude_title: ['holder', '\bcase\b', 'organizer', 'tester', 'socket', 'storage (?:box|case)', 'lir ?2032', '3\.6 ?v', '3\.7 ?v', 'rechargeable']

