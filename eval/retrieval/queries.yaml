        - {title: ['glass cleaner', 'window cleaner', 'glass (?:&|and) (?:surface|window|mirror|multi)', 'mirror cleaner', 'glass cleaning spray']}
    exclude_title: ['squeegee', 'cloths?\b', 'towels?\b', 'scraper', 'cooktop', 'stove', 'brush', 'robot', 'vacuum', '\btool', 'wand', '\bpipe', 'bong', 'glove']

  - id: oven_cleaner
