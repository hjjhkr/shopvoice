    exclude_title: ['\bpads?\b', 'starter kit', 'mop kit', 'spray mop -', 'spray mop with', 'mop (?:and|&) bucket', 'broom', 'machine\b(?! solution| formula)', 'scrubber', 'squeegee', 'cloths?\b', 'vacuum', 'sweeper', 'mats?\b']

  - id: candle_lighter
    type: attribute
    query: long lighter for candles
    relevant:
      title: ['lighters?\b(?! (?:fluid|fuel|butane|insert|case|pouch|holder|leash|sleeve|socket|plug|adapter|refill|flints?|wicks?))']
      text: ['candle']
    exclude_title: ['fuel refill(?!able)', 'fuel canister', 'gas refill(?!able)', 'cigarette lighter (?:plug|adapter|outlet|socket)', 'insert', 'molds?\b', 'wick lighter case']
    ideal: {title: ['candle lighter', '\blong\b', '\bwand\b', 'extended', '\bstick\b', 'multi[- ]purpose', '\bgrill\b', 'bbq']}

  - id: cr2032
    type: attribute
