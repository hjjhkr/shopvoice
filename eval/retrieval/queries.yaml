    exclude_title: ['\bmop\b', 'holder', 'caddy', 'rack', 'brush', 'steel wool', 'eraser', 'magic', 'duster', 'car wash', 'makeup', '\bbath\b', 'body', 'sponge cloths?', 'cellulose cloth', 'dishcloth', 'swedish', 'squeegee', 'soap dispens', 'grout', 'blinds?\b', 'dryer']
